name: Update ENTSO-E Data

on:
  schedule:
    # Run every 20-30 min at off-peak minutes to avoid GitHub's heavy :00/:30 congestion
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache ENTSO-E past days
        uses: actions/cache@v4
        with:
          path: cache/
          key: entsoe-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            entsoe-cache-${{ runner.os }}-

      - name: Run ENTSO-E fetch script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python scripts/fetch_entsoe.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update ENTSO-E data"
            git push
          fi
